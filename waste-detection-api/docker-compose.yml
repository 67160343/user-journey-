

services:
  # REST API Service
  api_service:
    build: .
    container_name: waste_detection_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=secret
      - DB_NAME=waste_db
    depends_on:
      - db
    restart: always

  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: waste_detection_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: waste_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: