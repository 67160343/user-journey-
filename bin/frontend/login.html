<!DOCTYPE html><html lang="th"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>เข้าสู่ระบบ | AI Waste Detection</title>    <style>        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');        * {            box-sizing: border-box;            font-family: 'Sarabun', sans-serif;            margin: 0;            padding: 0;        }        body {            background-color: #090d16; /* สีพื้นหลังสไตล์ศูนย์ควบคุม */            color: #e2e8f0;            height: 100vh;            display: flex;            justify-content: center;            align-items: center;        }        .login-container {            background-color: #111827;            padding: 40px;            border-radius: 12px;            width: 100%;            max-width: 400px;            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);            border-top: 5px solid #10b981;        }        .login-header {            text-align: center;            margin-bottom: 30px;        }        .login-header h2 {            color: #10b981;            margin-bottom: 10px;        }        .login-header p {            color: #9ca3af;            font-size: 14px;        }        .input-group {            margin-bottom: 20px;        }        .input-group label {            display: block;            margin-bottom: 8px;            font-size: 14px;            color: #d1d5db;        }        .input-group input {            width: 100%;            padding: 12px;            border-radius: 6px;            border: 1px solid #374151;            background-color: #030712;            color: #ffffff;            font-size: 16px;            outline: none;            transition: border-color 0.2s;        }        .input-group input:focus {            border-color: #10b981;        }        .login-btn {            width: 100%;            padding: 14px;            font-size: 16px;            font-weight: bold;            color: #090d16;            background-color: #10b981;            border: none;            border-radius: 6px;            cursor: pointer;            transition: background 0.2s, box-shadow 0.2s;            margin-top: 10px;        }        .login-btn:hover {            background-color: #059669;            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);        }        #error-message {            color: #ef4444;            font-size: 14px;            text-align: center;            margin-top: 15px;            display: none;        }    </style></head><body>    <div class="login-container">        <div class="login-header">            <h2>AI Waste Detection</h2>            <p>กรุณาเข้าสู่ระบบเพื่อเข้าถึงแผงควบคุม</p>        </div>        <form id="loginForm">            <div class="input-group">                <label for="username">ชื่อผู้ใช้งาน (Username)</label>                <input type="text" id="username" placeholder="admin" required>             </div>                        <div class="input-group">                <label for="password">รหัสผ่าน (Password)</label>                <input type="password" id="password" placeholder="1234" required>            </div>            <button type="submit" class="login-btn">เข้าสู่ระบบ</button>            <div id="error-message">ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง!</div>        </form>    </div>    <script>        document.getElementById('loginForm').addEventListener('submit', async function(e) {            e.preventDefault(); // ป้องกันไม่ให้หน้าเว็บรีเฟรช            const username = document.getElementById('username').value;            const password = document.getElementById('password').value;            const errorMessage = document.getElementById('error-message');            try {                // ยิง Request ไปยัง API ของคุณ                 // สังเกตพอร์ตที่ใช้คือ 3000 ตามที่คุณตั้งไว้ใน Backend [cite: 1, 5]                const response = await fetch('http://localhost:3000/api/v1/auth/login', {                    method: 'POST',                    headers: {                        'Content-Type': 'application/json'                    },                    body: JSON.stringify({ username: username, password: password })                });                const data = await response.json();                if (response.status === 200 && data.status === 'success') { [cite: 3]                    // ถ้ารหัสผ่านถูก ให้เก็บ Token ไว้ในเบราว์เซอร์                    localStorage.setItem('authToken', data.token); [cite: 3]                    // แล้วเด้งไปยังหน้า Dashboard (x1.html)                    window.location.href = 'x1.html';                } else {                    // ถ้ารหัสผ่านผิด ให้แสดงข้อความแจ้งเตือน                     errorMessage.style.display = 'block';                    errorMessage.innerText = data.message || 'ข้อมูลการเข้าระบบไม่ถูกต้อง';                }            } catch (error) {                errorMessage.style.display = 'block';                errorMessage.innerText = 'ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ (กรุณาเช็คว่ารัน Backend หรือยัง)';            }        });    </script></body></html>
